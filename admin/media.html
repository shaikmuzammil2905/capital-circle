        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="page-title-breadcrumb">
                        <h1 class="page-title">Media Library (Cloudinary Integrated)</h1>
                        <span class="page-breadcrumb">Manage Website Assets, Photos & Cloud Storage</span>
                    </div>
                </div>

                <div class="topbar-actions">
                    <label class="btn btn-primary" style="cursor: pointer;">
                        <span>+ Upload Image</span>
                        <input type="file" id="mediaUploadInput" accept="image/*" style="display: none;">
                    </label>
                </div>
            </header>

            <div class="admin-content-body">
                <div class="admin-card">
                    <div class="card-header">
                        <div class="search-input-wrapper">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="mediaSearchInput" class="form-control" placeholder="Search media by title or URL...">
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="media-grid" id="mediaGrid">
                            <!-- Dynamic Media Items -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/db.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const DB = window.CapitalCircleDB;
            if (!DB) return;

            async function renderMedia() {
                const search = document.getElementById('mediaSearchInput').value;
                const items = await DB.getMedia(search);
                const grid = document.getElementById('mediaGrid');

                if (items.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--admin-text-dark); padding: 32px;">No media assets found.</p>`;
                    return;
                }

                grid.innerHTML = items.map(m => `
                    <div class="media-item-card">
                        <div class="media-preview-wrapper">
                            <img src="${m.url}" class="media-preview-img" alt="${m.title}">
                        </div>
                        <div class="media-item-info">
                            <div class="media-item-title" title="${m.title}">${m.title}</div>
                            <div class="media-item-meta">${m.usage_location || 'Cloudinary Media'}</div>
                            <div style="display: flex; gap: 6px; margin-top: 8px;">
                                <button class="btn btn-secondary btn-sm copy-url-btn" data-url="${m.url}" style="flex: 1; padding: 4px;">Copy URL</button>
                                <button class="btn btn-danger btn-sm delete-media-btn" data-id="${m.id}" style="padding: 4px 8px;">✕</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.copy-url-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        navigator.clipboard.writeText(btn.dataset.url);
                        showToast('Media URL copied to clipboard!', 'info');
                    });
                });

                document.querySelectorAll('.delete-media-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (confirm('Are you sure you want to delete this media asset?')) {
                            await DB.deleteMedia(btn.dataset.id);
                            showToast('Media deleted successfully', 'success');
                            renderMedia();
                        }
                    });
                });
            }

            document.getElementById('mediaSearchInput').addEventListener('input', renderMedia);

            document.getElementById('mediaUploadInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                showToast('Uploading photo to Cloudinary...', 'info');
                const url = await uploadToCloudinary(file);
                
                await DB.saveMedia({
                    title: file.name,
                    url: url,
                    usage_location: 'Uploaded via Admin Media'
                });

                showToast('Image uploaded successfully to Cloudinary', 'success');
                renderMedia();
            });

            renderMedia();
        });
    </script>
