<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Capital Circle Law Offices CMS</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Admin Stylesheet -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-brand-header">
            <h1 class="login-brand-title">CAPITAL CIRCLE</h1>
            <div class="login-brand-sub">ADMINISTRATION PORTAL</div>
            <p style="font-size: 12px; color: var(--admin-text-muted); margin-top: 8px;">
                Authorized personnel authentication required.
            </p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">Email / Admin Username *</label>
                <input type="text" id="adminEmail" required placeholder="admin@capitalcirclelaw.com" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="adminPassword">Security Password *</label>
                <input type="password" id="adminPassword" required placeholder="••••••••••••" autocomplete="current-password">
            </div>

            <div id="loginErrorMessage" style="display: none; color: var(--admin-danger); font-size: 12px; margin-bottom: 16px; text-align: center; background: var(--admin-danger-bg); padding: 8px; border-radius: var(--admin-radius-sm);">
                Invalid credentials provided.
            </div>

            <button type="submit" class="btn btn-primary full-width" style="width: 100%; justify-content: center; padding: 12px;">
                Authenticate & Access Dashboard &rarr;
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 11px; color: var(--admin-text-dark); border-top: 1px solid var(--admin-border); padding-top: 16px;">
            &copy; 2026 Capital Circle Law Offices CMS • All Rights Reserved
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/db.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value;
            const errBox = document.getElementById('loginErrorMessage');
            errBox.style.display = 'none';

            const result = await window.CapitalCircleDB.authenticateAdmin(email, pass);
            if (result.success) {
                showToast('Authentication successful. Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);
            } else {
                errBox.innerText = result.message || 'Invalid credentials.';
                errBox.style.display = 'block';
                showToast('Authentication failed', 'error');
            }
        });
    </script>
</body>
</html>
