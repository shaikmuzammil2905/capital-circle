                        <span class="admin-name" id="adminUserName">Administrator</span>
                        <span class="admin-role">Super Admin</span>
                    </div>

                <button class="logout-btn" id="adminLogoutBtn" title="Logout">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="page-title-breadcrumb">
                        <h1 class="page-title">Global Website Settings</h1>
                        <span class="page-breadcrumb">Manage Firm Metadata, Contact Info & SEO</span>
                    </div>
                </div>
            </header>

            <div class="admin-content-body">
                <form id="settingsForm">
                    <div class="admin-card">
                        <div class="card-header">
                            <h2 class="card-title">General Firm Information</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="siteName">Official Firm Name *</label>
                                <input type="text" id="siteName" required>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="sitePhone">Direct Phone Lines *</label>
                                    <input type="text" id="sitePhone" required>
                                </div>
                                <div class="form-group">
                                    <label for="siteEmail">Contact Email Addresses *</label>
                                    <input type="text" id="siteEmail" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="siteAddress">Corporate Office Address *</label>
                                <input type="text" id="siteAddress" required>
                            </div>

                            <div class="form-group">
                                <label for="siteFooterText">Footer Overview Description *</label>
                                <textarea id="siteFooterText" rows="3" required></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="admin-card">
                        <div class="card-header">
                            <h2 class="card-title">Default SEO Metadata</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="siteSeoTitle">Global Page Meta Title</label>
                                <input type="text" id="siteSeoTitle">
                            </div>
                            <div class="form-group">
                                <label for="siteSeoDesc">Global Meta Description</label>
                                <textarea id="siteSeoDesc" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary" style="padding: 12px 24px;">Save Global Settings</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/db.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const DB = window.CapitalCircleDB;
            if (!DB) return;

            const settings = await DB.getSettings();
            document.getElementById('siteName').value = settings.site_name || 'Capital Circle Law Offices';
            document.getElementById('sitePhone').value = settings.phone || '';
            document.getElementById('siteEmail').value = settings.email || '';
            document.getElementById('siteAddress').value = settings.address || '';
            document.getElementById('siteFooterText').value = settings.footer_text || '';
            document.getElementById('siteSeoTitle').value = settings.seo_title || '';
            document.getElementById('siteSeoDesc').value = settings.seo_description || '';

            document.getElementById('settingsForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const updated = {
                    site_name: document.getElementById('siteName').value.trim(),
                    phone: document.getElementById('sitePhone').value.trim(),
                    email: document.getElementById('siteEmail').value.trim(),
                    address: document.getElementById('siteAddress').value.trim(),
                    footer_text: document.getElementById('siteFooterText').value.trim(),
                    seo_title: document.getElementById('siteSeoTitle').value.trim(),
                    seo_description: document.getElementById('siteSeoDesc').value.trim()
                };

                await DB.saveSettings(updated);
                showToast('Website global settings updated successfully', 'success');
            });
        });
    </script>
</body>
